<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Heart – Happy New Year</title>

<style>
/* ===== Reset ===== */
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: radial-gradient(circle at top, #1caae2, #4337e6);
  font-family: Arial, sans-serif;
}

/* ===== Scene ===== */
.scene {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 300px;
  height: 300px;
  transform-style: preserve-3d;
  transform: translate(-50%, -50%);
  animation: spin 12s linear infinite;
}

/* ===== Heart Sparkles ===== */
.spark {
  position: absolute;
  width: 6px;
  height: 6px;
  background: #e7052e;
  border-radius: 50%;
  box-shadow: 0 0 12px #e6062f, 0 0 25px #e9053a;
}

/* ===== Rotation ===== */
@keyframes spin {
  from {
    transform: translate(-50%, -50%) rotateX(0deg) rotateY(0deg);
  }
  to {
    transform: translate(-50%, -50%) rotateX(360deg) rotateY(360deg);
  }
}

/* ===== Text ===== */
.message {
  position: absolute;
  bottom: 60px;
  width: 100%;
  text-align: center;
  color: rgb(10, 10, 10);
  text-shadow: 0 0 15px #ff4d6d;
}

.message h1 {
  font-size: 42px;
  margin: 0;
}

.message h2 {
  font-size: 24px;
  margin: 5px 0 0;
  color: #ff9bb3;
}
</style>
</head>

<body>

<div class="scene" id="heart"></div>

<div class="message">
  <h1>❤️ Happy New Year 2026 ❤️</h1>
  <h2>May Your Life Shine with Love & Joy bavaa</h2>
</div>

<script>
/* ===== Generate 3D Heart ===== */
const heart = document.getElementById("heart");

for (let i = 0; i < 200; i++) {
  const dot = document.createElement("div");
  dot.className = "spark";

  const t = Math.random() * Math.PI * 2;

  // Heart equation
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t)
          - 5 * Math.cos(2*t)
          - 2 * Math.cos(3*t)
          - Math.cos(4*t);
  const z = (Math.random() - 0.5) * 80;

  dot.style.transform = `
    translate3d(${x * 6}px, ${-y * 6}px, ${z}px)
  `;

  // Sparkle animation
  dot.animate([
    { opacity: 0.1, transform: dot.style.transform + " scale(0.6)" },
    { opacity: 1, transform: dot.style.transform + " scale(1.5)" },
    { opacity: 0.1, transform: dot.style.transform + " scale(0.6)" }
  ], {
    duration: 2000 + Math.random() * 2000,
    iterations: Infinity
  });

  heart.appendChild(dot);
}
</script>

</body>
</html>
